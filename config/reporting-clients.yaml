clients:
  - name: Vivéa Skincare
    slug: vivea-skincare
    report_type: shopping
    industry: Beauty & Skincare
    campaign_objective: Brand Awareness, Sales
    include_summary: false  # no Performance Summary on Vivéa's report
    logo: vivea-skincare.png
    platforms:
      meta:
        account_id: "1275482973765975"
      google_ads:
        customer_id: "4174717031"
        # Google table shows headline Conversions (Conv.) — Tonya confirmed Google's
        # true purchase count is the headline figure (~2), not All Conversions (~729).
        # This also flows to hero Purchases / AOV / ROAS so the report stays consistent.
        conversion_metric: conversions

  - name: Aqua Spa
    slug: aquaspa
    report_type: shopping
    industry: Health & Wellness
    campaign_objective: Service Bookings
    hero_hide_roas: true  # drop the ROAS hero tile
    logo: aquaspa.png
    platforms:
      meta:
        account_id: "956490350465982"

  - name: Alpha 1 Builders
    slug: alpha-1-builders
    report_type: brand
    industry: Construction & Trades
    campaign_objective: Lead Generation
    # Same custom structure as Childlife Essentials
    hero_hide_conversions: true  # drop the Conversions hero tile (awareness-only)
    hero_pack: true  # pack the remaining hero tiles (Website Views + Total Spend) close together on the left
    hero_hide_subs: true  # remove the small sub-labels under the hero numbers
    hide_meta_results: true  # drop the Meta Results / Cost-per-Result columns
    hide_section_summary: true  # remove the grey summary line above the table
    logo: alpha-1-builders.png
    platforms:
      meta:
        account_id: "139577415846568"
      google_ads:
        customer_id: "6775944314"

  - name: Alden
    slug: alden
    report_type: brand
    industry: Aged Care
    campaign_objective: Brand Awareness, Lead Generation
    include_summary: false  # no Performance Summary — keep the report to one page
    one_page: true  # tighten row height so all ad groups + ad sets fit on a single page
    hide_meta_results: true  # drop the Meta Results / Cost-per-Result columns (Alden's Meta is awareness, no tracked results)
    meta_exclude_adsets: event  # drop any Meta ad set with "event" in the name (the Open Home event ad sets)
    logo: alden.png  # MANUAL: drop PNG into config/client-logos/alden.png (Drive link is a folder)
    platforms:
      google_ads:
        customer_id: "6530211308"  # UCG BRAND ACCOUNT (Ultimate Care Group / Alden)
        active_only: true  # report only currently-enabled campaigns. NOTE: Aug 2026 was a one-off manual exception that INCLUDED the paused Madison (Retirement Village) campaign — that report is already finalised. Do NOT re-collect Aug 2026 for Alden or Madison will drop out.
        conversion_metric: conversions  # CONV. column = Google's headline Conversions (Primary goals, matches the Google Ads UI)
      meta:
        account_id: "3686930434948954"

  - name: Brows & Beyond
    slug: brows-and-beyond
    report_type: brand
    industry: Beauty & Cosmetic Tattooing
    campaign_objective: Service Bookings
    hero_hide_conversions: true  # drop the Conversions hero tile
    hero_pack: true  # pack Website Views + Total Spend together on the left
    hero_hide_subs: true  # remove the hero sub-labels ("Google clicks…", "All platforms")
    hide_section_summary: true  # remove the grey "impressions · clicks · spend" line above the table
    hide_google_conversions: true  # remove the All Conv. and Cost / Conv. columns from the Google table
    logo: brows-and-beyond.png  # MANUAL: drop PNG into config/client-logos/brows-and-beyond.png (Drive link is a folder)
    platforms:
      google_ads:
        customer_id: "9083966033"

